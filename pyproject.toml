[project]
name = "flask-wiki"
version = "2.0.0"
description = "Simple file-based wiki for Flask"
readme = "README.md"
authors = [{name = "RERO+", email = "software@rero.ch"}]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"

dependencies = [
    "bootstrap-flask",
    "Flask",
    "flask-wtf",
    "babel>=2.16.0",
    "flask-babel>=3.0.0",
    "wtforms",
    "werkzeug>=0.15",
    "markdown",
    "beautifulsoup4",
    "click",
    "whoosh-reloaded>=2.7.5",
    "markdown-captions>=2.1.2",
    "poethepoet",
]

[dependency-groups]
dev = [
    "ipython",
    "pip-audit",
    "pytest",
    "ruff>=0.12.3",
]

[project.entry-points."flask.commands"]
flask_wiki = "flask_wiki.cli:flask_wiki"

[tool.pytest.ini_options]
addopts = "--color=yes --doctest-modules --ignore=flask_wiki/config.py --ignore=tests/data"
testpaths = "tests flask_wiki"

[tool.ruff]
extend-exclude = ["config.py"]
line-length = 120

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    "COM812",  # managed by formatter
    "ANN", # type annotations are not used in this project
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = [
    "INP001",  # not a package, standalone script
    "S106",    # hardcoded SECRET_KEY="dev" is intentional in examples
]
"tests/*.py" = [
    "S101",    # asserts allowed
    "S106",    # hardcoded passwords allowed
    "ARG",     # unused arguments allowed
    "FBT",     # boolean positional args allowed
    "INP001",  # pytest discovers tests without __init__.py
    "PLR2004", # magic values allowed
    "PLC0415", # imports not at top level allowed (fixtures)
    "PTH",     # os.path in tests is idiomatic and clear
]
"tests/conftest.py" = [
    "PLC0415", # imports not at top level allowed (fixtures)
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.poe.tasks]
compile_catalog = "pybabel compile -d flask_wiki/translations"
extract_messages = "pybabel extract --project Flask-Wiki -F pyproject.toml -k gettext -k lazy_gettext -o flask_wiki/translations/messages.pot flask_wiki"
format =  {cmd = "ruff format .", help = "Formats all files"}
init_catalog = "pybabel init -i flask_wiki/translations/messages.pot -d flask_wiki/translations -l"
lint = {cmd = "ruff check", help = "Checks linting"}
run_tests = {cmd = "./scripts/test", help = "Runs all tests"}
update_catalog = "pybabel update -i flask_wiki/translations/messages.pot -d flask_wiki/translations --no-fuzzy-matching --ignore-obsolete true"

[[tool.babel.mappings]]
method = "python"
pattern = "**.py"

[[tool.babel.mappings]]
method = "jinja2"
pattern = "**/templates/**.html"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.uv]
package = true
